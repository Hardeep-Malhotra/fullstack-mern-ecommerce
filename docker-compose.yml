
services:
  redis:
    image: redis:7-alpine
    container_name: shopzy-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/config/config.env

    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379

    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: shopzy-ai-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      - backend

volumes:
  redis_data:
